openapi: 3.1.0

info:
  title: OneProof
  version: 0.1.0-entwurf
  summary: Fallbezogener Nachweisbedarf für Verwaltungsleistungen
  description: |
    OneProof beantwortet eine Frage, die im NOOTS bewusst offen bleibt:
    **welche Nachweise braucht dieser eine Antrag?**

    Das NOOTS liefert einen angeforderten Nachweistyp. Es entscheidet nicht, ob
    er erforderlich ist. Das Datenmanagementkonzept sagt das ausdrücklich:

    > „über das NOOTS werden keine Tatsachen übertragen, sondern nur Daten,
    > der Data Consumer macht daraus eine Tatsache."
    >
    > — FITKO, Datenmanagementkonzept NOOTS v1.1

    Genau diese Schicht ist OneProof.

    ## Die Einheit ist die Tatsache, nicht die Datei

    Eine Anforderung beschreibt eine zu belegende **Tatsache** mit Person und
    Zeitraum — nicht ein Dokument. Ein Dokument ist nur einer von mehreren Wegen,
    sie zu belegen; ein Registerabruf ist ein anderer.

    ## OneProof entscheidet nichts

    Der Bedarf wird nicht erfunden, sondern aus einem **Nachweisprofil**
    abgeleitet, das die Behörde fachlich freigegeben hat. Das Profil ist
    versioniert, die Ableitung deterministisch: dieselben Antragsdaten ergeben
    immer dieselbe Liste. Jede Antwort trägt die Profilversion mit, gegen die sie
    berechnet wurde.

    Über Anspruch, Bewilligung oder Ablehnung entscheidet OneProof nicht. Es
    erstellt auch keinen Risiko- oder Betrugsscore.

    ## Anschluss an bestehende Standards

    | Begriff hier | Herkunft |
    |---|---|
    | `Anforderung` | CCCEV `Requirement` |
    | `zulaessigeQuellen` | CCCEV `EvidenceTypeList` |
    | `nachweistyp` | XNachweis 2 / DAMAS-Kennung |
    | `hash`, `mimeType` | FIT-Connect `contentStructure.attachments` |

    Neu — und in keinem der drei Standards vorhanden — sind der **Status je
    Anforderung**, der **Personen- und Zeitraumbezug** und das **Manifest** mit
    Fundstelle und Prüfhistorie.

    ## Stand

    Entwurf. Die Beispiele zeigen denselben erfundenen Fall wie der Klick-Dummy:
    ein Elterngeldantrag beim Landkreis Auenthal. Kein echter Verwaltungsdienst,
    keine echte Registerabfrage.

servers:
  - url: https://api.oneproof.example/v1
    description: Noch keine echte Instanz. „Test Request“ antwortet direkt im Browser mit den Beispielen dieser Seite.

tags:
  - name: Fall
    description: Nachweisbedarf ermitteln und fortschreiben.
  - name: Nachweise
    description: Was kein Register belegt, kommt von der antragstellenden Person.
  - name: Übergabe
    description: Ergebnis für Fachverfahren, DMS oder E-Akte.

paths:
  /faelle:
    post:
      tags: [Fall]
      operationId: fallAnlegen
      summary: Nachweisbedarf ermitteln
      description: |
        Nimmt den Antrag als XFamilie-Nachricht `elterngeldantrag.antrag.0201`
        entgegen, wendet das benannte Nachweisprofil an und gibt die
        Anforderungen für genau diesen Fall zurück.

        Anforderungen, die ein Register beantworten kann, werden dabei über das
        NOOTS abgerufen. Der Abruf läuft synchron, solange er in wenigen Sekunden
        antwortet; sonst steht die Anforderung zunächst auf `wird_geprueft`.
      x-codeSamples:
        - lang: javascript
          label: JavaScript (fetch)
          source: |
            const xml = await fetch('/beispiele/erika-mustermann.xml').then((r) => r.text())

            const res = await fetch(
              'https://api.oneproof.example/v1/faelle?profil=elterngeld-bund@2026-08-01',
              {
                method: 'POST',
                headers: { 'Content-Type': 'application/xml' },
                body: xml,
              },
            )
            const fall = await res.json()
        - lang: shell
          label: curl
          source: |
            curl -X POST 'https://api.oneproof.example/v1/faelle?profil=elterngeld-bund@2026-08-01' \
              -H 'Content-Type: application/xml' \
              --data-binary @erika-mustermann.xml
      parameters:
        - $ref: '#/components/parameters/profil'
      requestBody:
        required: true
        content:
          application/xml:
            schema:
              type: string
              description: |
                Nachricht `elterngeldantrag.antrag.0201` nach
                [XFamilie 1.4.0](https://www.xrepository.de/api/xrepository/urn:xoev-de:kosit:standard:xfamilie_1.4.0:dokument:Spezifikation_1.4.0),
                valide gegen `xfamilie-elterngeldantrag.xsd`. Das Beispiel enthält
                nur Pflichtfelder und die drei Angaben, die das Profil auswertet.

                Als Datei: [erika-mustermann.xml](/beispiele/erika-mustermann.xml)
            example: |
              <?xml version="1.0" encoding="UTF-8"?>
              <xfe:elterngeldantrag.antrag.0201
                  xmlns:xfe="http://www.xoev.de/xfamilie/elterngeldantrag/1.4.0"
                  xmlns:xfb="http://www.xoev.de/xfamilie/baukasten/1.4.0"
                  produkt="Elterngeld-Beispielportal" produkthersteller="Beispiel-Softwarehaus GmbH" standard="XFamilie" version="1.4.0">
                <xfb:nachrichtenkopf>
                  <xfb:identifikation.nachricht>
                    <xfb:nachrichtenUUID>6f1c2a3e-8b4d-4e2a-9c1f-3d5e7a9b1c2d</xfb:nachrichtenUUID>
                    <xfb:nachrichtentyp><code>0201</code></xfb:nachrichtentyp>
                    <xfb:erstellungszeitpunkt>2026-09-10T12:00:00</xfb:erstellungszeitpunkt>
                  </xfb:identifikation.nachricht>
                  <xfb:leser>
                    <xfb:behoerdenkennung>
                      <xfb:praefix listVersionID="51"><code>egs</code></xfb:praefix>
                      <xfb:kennung><code>auenthal</code></xfb:kennung>
                    </xfb:behoerdenkennung>
                    <xfb:behoerdenname>Elterngeldstelle Landkreis Auenthal</xfb:behoerdenname>
                  </xfb:leser>
                  <xfb:autor>
                    <xfb:behoerdenkennung>
                      <xfb:praefix listVersionID="51"><code>fap</code></xfb:praefix>
                      <xfb:kennung><code>beispielportal</code></xfb:kennung>
                    </xfb:behoerdenkennung>
                    <xfb:erreichbarkeit>
                      <xfb:kanal listVersionID="4.1"><code>01</code></xfb:kanal>
                      <xfb:kennung>antrag@beispielportal.example</xfb:kennung>
                    </xfb:erreichbarkeit>
                    <xfb:anschrift>
                      <xfb:postfach>
                        <xfb:wohnort>Auenthal</xfb:wohnort>
                        <xfb:postleitzahl>12345</xfb:postleitzahl>
                      </xfb:postfach>
                    </xfb:anschrift>
                    <xfb:behoerdenname>Elterngeld-Beispielportal</xfb:behoerdenname>
                  </xfb:autor>
                </xfb:nachrichtenkopf>
                <xfb:zeitstempelAntragsstellung>2026-09-10T12:00:00</xfb:zeitstempelAntragsstellung>
                <xfb:transaktionsid>0b7e4d52-1a3c-4f6e-8d2b-5c9a1e3f7b40</xfb:transaktionsid>

                <!-- OneProof: Geburtsdatum -> Geburt wird über NOOTS belegt -->
                <xfe:kind>
                  <xfe:nameKind>
                    <xfb:familienname.unstrukturiert><xfb:name>Mustermann</xfb:name></xfb:familienname.unstrukturiert>
                    <xfb:vornamen><xfb:name>Mila</xfb:name></xfb:vornamen>
                  </xfe:nameKind>
                  <xfe:geburtsdatum>
                    <xfb:geburtsdatum><xfb:jahrMonatTag>2026-08-02</xfb:jahrMonatTag></xfb:geburtsdatum>
                  </xfe:geburtsdatum>
                  <xfe:besondersFruehGeborenesKind><xfe:besondersFruehGeborenesKind>false</xfe:besondersFruehGeborenesKind></xfe:besondersFruehGeborenesKind>
                  <xfe:adoption><xfe:adoption>false</xfe:adoption></xfe:adoption>
                  <xfe:mehrlingsgeburt><xfe:mehrlingsgeburt>false</xfe:mehrlingsgeburt></xfe:mehrlingsgeburt>
                </xfe:kind>
                <xfe:elterngeldantrag><code>04</code></xfe:elterngeldantrag>
                <xfe:gesamteinkommen><code>13</code></xfe:gesamteinkommen>

                <xfe:elternteilEins>
                  <xfe:persoenlicheAngaben>
                    <xfe:name>
                      <xfb:familienname.unstrukturiert><xfb:name>Mustermann</xfb:name></xfb:familienname.unstrukturiert>
                      <xfb:vornamen><xfb:name>Erika</xfb:name></xfb:vornamen>
                    </xfe:name>
                    <xfe:geburtsdatum>1994-05-12</xfe:geburtsdatum>
                    <xfe:geschlecht><code>w</code></xfe:geschlecht>
                    <xfe:familienstand><xfb:familienstand><code>VH</code></xfb:familienstand></xfe:familienstand>
                    <xfe:unverheiratetesZusammenleben>false</xfe:unverheiratetesZusammenleben>
                    <xfe:alleinerziehend>false</xfe:alleinerziehend>
                    <xfe:staatsangehoerigkeit>
                      <xfe:staatsangehoerigkeiten>
                        <xfb:staatsangehoerigkeit listVersionID="2026-08-05"><code>000</code></xfb:staatsangehoerigkeit>
                      </xfe:staatsangehoerigkeiten>
                    </xfe:staatsangehoerigkeit>
                  </xfe:persoenlicheAngaben>
                  <xfe:anschrift>
                    <xfe:anschriftInlandOderAusland>true</xfe:anschriftInlandOderAusland>
                    <xfe:anschriftInland>
                      <xfb:postleitzahl>12345</xfb:postleitzahl>
                      <xfb:strasse>Lindenweg</xfb:strasse>
                      <xfb:wohnort>Auenthal</xfb:wohnort>
                    </xfe:anschriftInland>
                  </xfe:anschrift>
                  <xfe:gewoehnlicherAufenthalt>
                    <xfe:wohnsitz><code>01</code></xfe:wohnsitz>
                    <xfe:auslaendischesArbeitsverhaeltnis><xfe:auslaendischesArbeitsverhaeltnis>false</xfe:auslaendischesArbeitsverhaeltnis></xfe:auslaendischesArbeitsverhaeltnis>
                    <xfe:mitgliedNatoZivilesGefolge>false</xfe:mitgliedNatoZivilesGefolge>
                    <xfe:mitgliedDiplomatischeMissionOderKonsularischeVertretung>false</xfe:mitgliedDiplomatischeMissionOderKonsularischeVertretung>
                  </xfe:gewoehnlicherAufenthalt>
                  <xfe:kindschaftsverhaeltnis><xfe:kindschaftsverhaeltnis><code>01</code></xfe:kindschaftsverhaeltnis></xfe:kindschaftsverhaeltnis>
                  <xfe:haushaltszugehoerigkeitDesKindes>
                    <xfe:betreuungUndErziehungImEigenenHaushalt><xfb:liegtVor>true</xfb:liegtVor></xfe:betreuungUndErziehungImEigenenHaushalt>
                  </xfe:haushaltszugehoerigkeitDesKindes>
                  <xfe:beantragungElterngeld>
                    <xfe:basisElterngeld>true</xfe:basisElterngeld>
                    <xfe:elterngeldPlus>false</xfe:elterngeldPlus>
                    <xfe:partnerschaftsBonusMonate>false</xfe:partnerschaftsBonusMonate>
                  </xfe:beantragungElterngeld>
                  <xfe:krankenversicherung><xfe:versicherungsart><code>02</code></xfe:versicherungsart></xfe:krankenversicherung>

                  <!-- OneProof: vor der Geburt angestellt -> Einkommensnachweis 08/2025 bis 07/2026 offen -->
                  <xfe:einkommenVorGeburt>
                    <xfe:einkommenAusNichtselbststaendigerTaetigkeit>true</xfe:einkommenAusNichtselbststaendigerTaetigkeit>
                    <xfe:selbstaendigeBeschaeftigung>false</xfe:selbstaendigeBeschaeftigung>
                    <xfe:gewerbebetrieb>false</xfe:gewerbebetrieb>
                    <xfe:landUndForstwirtschaft>false</xfe:landUndForstwirtschaft>
                    <xfe:einkommensersatzleistungen><xfe:bezugEinkommensersatzleistungen>false</xfe:bezugEinkommensersatzleistungen></xfe:einkommensersatzleistungen>
                  </xfe:einkommenVorGeburt>

                  <!-- OneProof: im Bezugszeitraum keine Arbeit -> Nachweis entfällt -->
                  <xfe:einkommenWaehrendBezugszeitraum>
                    <xfe:selbstaendigeBeschaeftigung>false</xfe:selbstaendigeBeschaeftigung>
                    <xfe:landUndForstwirtschaft>false</xfe:landUndForstwirtschaft>
